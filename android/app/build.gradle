plugins { id 'com.android.application' }
android {
    namespace 'com.ogunlab.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ogunlab.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.3.0-deneme'
        manifestPlaceholders = [cleartext:'false']
    }
    buildTypes { debug { manifestPlaceholders = [cleartext:'true'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation platform('com.google.firebase:firebase-bom:34.0.0'); implementation 'com.google.firebase:firebase-messaging' }
